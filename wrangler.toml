name = "library"
main = "workers/worker.ts"
compatibility_date = "2026-01-01"

# `wrangler deploy` (and `wrangler dev`) first runs this to build the frontend into dist/,
# so a plain `npx wrangler deploy` - e.g. from Cloudflare's GitHub integration - ships site + API in one go.
[build]
command = "npm run build"

# Serve the built frontend (Vite -> dist/) from this same Worker.
# Only /api/* runs the Worker code; every other path is answered straight from the static assets
# (free, unlimited requests), and unknown paths fall back to index.html.
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# Single R2 Bucket for all PDFs
# Any top-level folder containing PDFs becomes a section in the library (headed by the folder name),
# e.g. baws/Speeches/*.pdf, baws/Letters/*.pdf. Folders starting with "_" or ".", and "Annotation" (per-PDF annotation JSON, created automatically), are reserved.
# An optional <folder>/metadata.json may set { "title": "Heading to show" } – it is created for you otherwise.
[[r2_buckets]]
binding = "PDF_BUCKET"
bucket_name = "baws"

# Optional settings. Uncomment the [vars] line and the ones you need.
#
# SECURITY (recommended): make the API refuse any request that did not pass Cloudflare Access, even if Access is
# ever switched off or misconfigured for the site. In Zero Trust -> Access -> Applications -> your app:
#   ACCESS_TEAM_DOMAIN = your team domain, e.g. "myteam.cloudflareaccess.com"
#   ACCESS_AUD         = the application's "Application Audience (AUD) Tag"
# Settings shows whether this is on.
#
# CORS: only needed if another origin calls the API (default is "*").
#
# [vars]
# ACCESS_TEAM_DOMAIN = "myteam.cloudflareaccess.com"
# ACCESS_AUD = "paste-the-aud-tag-here"
# ALLOWED_ORIGIN = "https://library.abhirajbibhar.workers.dev"
