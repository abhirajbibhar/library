name = "library"
main = "workers/worker.ts"
compatibility_date = "2026-01-01"

# Keep variables and secrets you set in the Cloudflare dashboard when this Worker is deployed from GitHub.
# Without this, a deploy replaces the dashboard's variables with whatever is in this file.
keep_vars = true

# `wrangler deploy` (and `wrangler dev`) first runs this to build the frontend into dist/,
# so a plain `npx wrangler deploy` - e.g. from Cloudflare's GitHub integration - ships site + API in one go.
[build]
command = "npm run build"

# Serve the built frontend (Vite -> dist/) from this same Worker.
# Only /api/* runs the Worker code; every other path is answered straight from the static assets
# (free, unlimited requests), and unknown paths fall back to index.html.
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# Single R2 Bucket for all PDFs
# Any top-level folder containing PDFs becomes a section in the library (headed by the folder name),
# e.g. baws/Speeches/*.pdf, baws/Letters/*.pdf. Folders starting with "_" or ".", and "Annotation" (per-PDF annotation JSON, created automatically), are reserved.
# An optional <folder>/metadata.json may set { "title": "Heading to show" } – it is created for you otherwise.
[[r2_buckets]]
binding = "PDF_BUCKET"
bucket_name = "baws"

# SECURITY (recommended). Set these in the dashboard, NOT in this file, so nothing private is committed:
# Workers & Pages -> library -> Settings -> Variables and Secrets -> Add (type "Secret"):
#   ACCESS_TEAM_DOMAIN  your Zero Trust team domain, e.g. myteam.cloudflareaccess.com
#   ACCESS_AUD          the Access application's "Application Audience (AUD) Tag"
# With both set, the API refuses any request that did not pass Cloudflare Access.
# Settings -> Security in the app shows whether it is on.
#
# ALLOWED_ORIGIN is not needed: the site and the API share one origin.
